<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛓️</text></svg>"
    />
    <title>Prison Counter</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: monospace;
      }

      .wall {
        width: 100vw;
        height: 100vh;
        background-color: #2b2b2b;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0),
          radial-gradient(rgba(0, 0, 0, 0.4) 1px, transparent 0);
        background-size:
          20px 20px,
          30px 30px;
        background-position:
          0 0,
          15px 15px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 15px;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        cursor: pointer;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 10px 15px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        z-index: 20;
        gap: 10px;
      }

      .date-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #ddd;
        font-size: 15px;
        font-weight: bold;
      }

      .current-date-text {
        text-transform: capitalize;
        text-align: center;
        cursor: pointer;
        padding: 6px 8px;
      }

      .nav-btn,
      .reset-btn {
        background: #1e1e1e;
        color: #ccc;
        border: 1px solid #444;
        min-height: 40px;
        min-width: 40px;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-family: monospace;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }

      .nav-btn:hover,
      .reset-btn:hover {
        background: #333;
        color: #fff;
        border-color: #666;
      }

      .reset-btn {
        background: #3a1c1c;
        border-color: #5a2828;
        font-size: 16px;
      }

      .reset-btn:hover {
        background: #5a2828;
        border-color: #7a3838;
      }

      #tally-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-content: flex-start;
        flex-grow: 1;
        overflow-y: auto;
        margin-top: 15px;
        padding: 5px;
      }

      #tally-container::-webkit-scrollbar {
        display: none;
      }
      #tally-container {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .group {
        position: relative;
        width: 45px;
        height: 55px;
        display: flex;
        justify-content: flex-start;
        gap: 8px;
        align-items: center;
      }

      .mark {
        background-color: #d8d8d8;
        box-shadow:
          -1px -1px 1px rgba(0, 0, 0, 0.8),
          1px 1px 1px rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        opacity: 0.9;
      }

      .vertical-mark {
        width: 4px;
        height: 100%;
        transform: rotate(calc(-2deg + 4deg * var(--rand)));
      }

      .horizontal-mark {
        position: absolute;
        top: 50%;
        left: -5px;
        width: 55px;
        height: 5px;
        transform: translateY(-50%) rotate(-18deg);
        z-index: 10;
      }

      .footer {
        color: #666;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        padding-top: 10px;
      }

      .counter {
        color: #888;
        font-weight: bold;
      }

      @media (max-width: 600px) {
        .wall {
          padding: 10px;
        }

        .navbar {
          padding: 8px 12px;
        }

        .current-date-text {
          font-size: 13px;
          padding: 4px;
        }

        .footer {
          font-size: 11px;
        }

        #tally-container {
          gap: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wall" id="wall">
      <div class="navbar" id="navbar">
        <div class="date-controls">
          <button class="nav-btn" id="prev-day">&lt;</button>
          <span class="current-date-text" id="current-date-text">---</span>
          <button class="nav-btn" id="next-day">&gt;</button>
        </div>
        <div>
          <button class="reset-btn" id="reset-btn" title="Reset Count">
            <svg viewBox="0 0 24 24" fill="#fff">
              <path
                d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12z"
              />
            </svg>
          </button>
        </div>
      </div>

      <div id="tally-container"></div>

      <div class="footer">
        <span>Tap / Left click: +1 | Right click: -1</span>
        <span class="counter">Total: <span id="day-count">0</span></span>
      </div>
    </div>

    <script>
      const wall = document.getElementById("wall");
      const container = document.getElementById("tally-container");
      const countDisplay = document.getElementById("day-count");
      const currentDateText = document.getElementById("current-date-text");
      const prevBtn = document.getElementById("prev-day");
      const nextBtn = document.getElementById("next-day");
      const resetBtn = document.getElementById("reset-btn");

      let currentDate = new Date();
      let dailyData =
        JSON.parse(localStorage.getItem("prison_days_dict")) || {};

      function getStorageKey(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, "0");
        const day = String(dateObj.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function getHumanReadableDate(dateObj) {
        const options = {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric",
        };
        return new Intl.DateTimeFormat("en-US", options).format(dateObj);
      }

      function getCurrentCount() {
        const dateKey = getStorageKey(currentDate);
        return dailyData[dateKey] || 0;
      }

      function render() {
        currentDateText.textContent = getHumanReadableDate(currentDate);

        const count = getCurrentCount();
        countDisplay.textContent = count;

        container.innerHTML = "";
        const totalGroups = Math.ceil(count / 5);

        for (let g = 0; g < totalGroups; g++) {
          const groupDiv = document.createElement("div");
          groupDiv.className = "group";

          const marksInGroup = Math.min(5, count - g * 5);

          for (let m = 1; m <= marksInGroup; m++) {
            const markDiv = document.createElement("div");

            if (m < 5) {
              markDiv.className = "mark vertical-mark";
              markDiv.style.setProperty("--rand", Math.sin(g * 5 + m));
            } else {
              markDiv.className = "mark horizontal-mark";
            }

            groupDiv.appendChild(markDiv);
          }

          container.appendChild(groupDiv);
        }

        container.scrollTop = container.scrollHeight;
      }

      function saveAndRender(newCount) {
        const dateKey = getStorageKey(currentDate);
        if (newCount <= 0) {
          delete dailyData[dateKey];
        } else {
          dailyData[dateKey] = newCount;
        }

        localStorage.setItem("prison_days_dict", JSON.stringify(dailyData));
        render();
      }

      wall.addEventListener("click", (e) => {
        if (e.target.closest("#navbar")) return;

        const currentCount = getCurrentCount();
        saveAndRender(currentCount + 1);
      });

      wall.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (e.target.closest("#navbar")) return;

        const currentCount = getCurrentCount();
        if (currentCount > 0) {
          saveAndRender(currentCount - 1);
        }
      });

      prevBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        currentDate.setDate(currentDate.getDate() - 1);
        render();
      });

      nextBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        currentDate.setDate(currentDate.getDate() + 1);
        render();
      });

      currentDateText.addEventListener("click", (e) => {
        e.stopPropagation();
        currentDate = new Date();
        render();
      });

      resetBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (confirm(`Do you really want to reset the count for this date?`)) {
          saveAndRender(0);
        }
      });

      render();
    </script>
  </body>
</html>
